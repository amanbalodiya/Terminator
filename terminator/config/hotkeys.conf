# Copy to ~/.config/terminator/hotkeys.conf and restart Terminator.
# Format: action=Ctrl+Key or Ctrl+Shift+Key or Alt+Key
# To change the new-tab shortcut, for example: new_tab=Ctrl+n
new_tab=Ctrl+t
close_tab=Ctrl+Shift+w
next_tab=Ctrl+Tab
zoom_in=Ctrl+plus
zoom_out=Ctrl+minus
zoom_reset=Ctrl+0
clear=Ctrl+l
interrupt=Ctrl+c
suspend=Ctrl+z
copy=Ctrl+Shift+c
paste=Ctrl+Shift+v
reverse_search=Ctrl+r
